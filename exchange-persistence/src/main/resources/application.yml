spring:
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/exchange
    username: exchange
    password: exchange123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    consumer:
      group-id: persistence-writer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: java.util.HashMap
        spring.json.use.type.headers: false
  jackson:
    modules-to-install: com.fasterxml.jackson.datatype.jsr310.JavaTimeModule
